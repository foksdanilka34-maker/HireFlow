services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: hireflow
      POSTGRES_USER: hireflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hireflow -d hireflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Стенд целиком (make up): одноразовые миграции, API, бот и кабинет за Caddy на http://localhost:8080.
  migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: src/HireFlow.Api/Dockerfile
    image: hireflow-api
    command: ["migrate"]
    restart: "no"
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=hireflow;Username=hireflow;Password=${POSTGRES_PASSWORD}
      Storage__LocalPath: /app/storage
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    image: hireflow-api
    env_file: .env
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=hireflow;Username=hireflow;Password=${POSTGRES_PASSWORD}
      Storage__LocalPath: /app/storage
      Hosting__TrustForwardedHeaders: "true"
      Hosting__DataProtectionKeysPath: /app/keys
      Telemetry__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    volumes:
      - resumes:/app/storage
      - dp-keys:/app/keys
    restart: unless-stopped
    # Команда самого API: GET /health/ready (в образе aspnet нет curl).
    healthcheck:
      test: ["CMD", "dotnet", "HireFlow.Api.dll", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    profiles: [app]
    build:
      context: .
      dockerfile: src/HireFlow.Bot/Dockerfile
    image: hireflow-bot
    env_file: .env
    environment:
      Bot__ApiBaseUrl: http://api:8080
      Telemetry__OtlpMetricsEndpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: src/HireFlow.Web/Dockerfile
    image: hireflow-web
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  # Метрики API и бота по OTLP; UI только с хоста: http://localhost:9090.
  prometheus:
    profiles: [app]
    image: prom/prometheus:v3.15.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-otlp-receiver
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  postgres-data:
  resumes:
  dp-keys:
  prometheus-data:
