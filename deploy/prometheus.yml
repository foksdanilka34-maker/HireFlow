# Метрики API и бота приходят по OTLP (--web.enable-otlp-receiver); scrape — только сам Prometheus и коллектор.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

otlp:
  # service.name из ресурса OTel становится меткой service_name на каждом ряду.
  promote_resource_attributes:
    - service.name

# SLO и алерты (design.md, раздел 16); runbook — docs/runbooks.
rule_files:
  - /etc/prometheus/rules/*.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Собственные метрики коллектора: up{job="otel-collector"} == 0 — телеметрия API и бота не доходит.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]
