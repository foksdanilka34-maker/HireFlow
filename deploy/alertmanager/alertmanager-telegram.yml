# Alertmanager с рассылкой в Telegram ботом дежурного. Выбирается в docker-compose.yml, если в .env заданы
# ALERT_TELEGRAM_BOT_TOKEN и ALERT_TELEGRAM_CHAT_ID: команда контейнера пишет их в файлы во /tmp контейнера.
# Тот же маршрут и подавления, что в alertmanager.yml — меняйте оба файла вместе.
route:
  receiver: telegram
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="critical"']
      repeat_interval: 1h

# Без коллектора данных нет, а без API нет и его SLO-метрик: показываем причину, а не следствия.
inhibit_rules:
  - source_matchers: ['alertname="TelemetryCollectorDown"']
    target_matchers: ['alertname=~"ApiDown|BotDown|ApiErrorBudgetFastBurn|ApiErrorBudgetSlowBurn|ApiLatencyHigh|ScreeningSlow|PublicApiSlow"']
  - source_matchers: ['alertname="ApiDown"']
    target_matchers: ['alertname=~"ApiErrorBudgetFastBurn|ApiErrorBudgetSlowBurn|ApiLatencyHigh|ScreeningSlow|PublicApiSlow"']

receivers:
  - name: telegram
    telegram_configs:
      - bot_token_file: /tmp/telegram/bot_token
        chat_id_file: /tmp/telegram/chat_id
        send_resolved: true
        parse_mode: HTML
        message: |-
          {{ range .Alerts }}<b>{{ if eq .Status "firing" }}FIRING{{ else }}RESOLVED{{ end }}</b> {{ .Labels.alertname }} ({{ .Labels.severity }})
          {{ .Annotations.summary }}
          <a href="{{ .Annotations.runbook_url }}">Runbook</a>
          {{ end }}
