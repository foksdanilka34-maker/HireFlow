# Tempo в одиночном режиме: трейсы от коллектора по OTLP gRPC, локальное хранилище, 7 дней.
stream_over_http_enabled: true
usage_report:
  reporting_enabled: false
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks
