# OpenTelemetry Collector: принимает OTLP от API и бота и раздаёт трейсы в Tempo, логи в Loki, метрики в Prometheus.
# Вторая линия защиты: удаляет адреса запросов (в пути бывает Telegram ID) и маскирует токен бота.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  attributes/drop-url:
    actions:
      - key: url.path
        action: delete
      - key: url.full
        action: delete
      - key: url.query
        action: delete
  # allow_all_keys: остальные атрибуты проходят как есть, маскируются только значения, похожие на токен бота.
  redaction:
    allow_all_keys: true
    blocked_values:
      - '\d{6,}:[A-Za-z0-9_-]{30,}'
    summary: silent
  batch: {}

exporters:
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-url, redaction, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/drop-url, redaction, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
